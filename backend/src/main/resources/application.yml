spring:
  application:
    name: teaching-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 8MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teaching_platform}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:12345678}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V15/V16 双方言占位符：本 profile（local/MySQL）注入 MySQL 方言
    placeholders:
      alterModifyColumn: "MODIFY COLUMN"
      fkChecksDisable: "SET FOREIGN_KEY_CHECKS = 0"
      fkChecksEnable: "SET FOREIGN_KEY_CHECKS = 1"
      # V16 的 ALTER 仅 MySQL 需要（H2 建表已带 AUTO_INCREMENT，重声明会重置自增计数器）；MySQL 侧为空前缀
      mysqlOnly: ""

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:replace-with-32-char-secret-1234}
  # scripts/path-b/backend.sh 注入仓库根绝对路径；默认 ../data/files 相对 backend/ CWD
  file-storage-root: ${FILE_STORAGE_ROOT:../data/files}
  http-access-log:
    enabled: true
  audit-log:
    retention-days: 180
    retention-enabled: true

# 实验作答行为采集与风险标记（技术方案 §4.4；本地 profile 不覆盖，全走默认值）
lab:
  behavior:
    ingest:
      max-batch-size: 100
      max-payload-bytes: 4096
      clock-skew-tolerance-ms: 600000
    risk:
      per-step-min-ms: 45000
      paste-chars-threshold: 500
      paste-ratio-threshold: 0.3
      hidden-count-threshold: 5
      hidden-ratio-threshold: 0.5
