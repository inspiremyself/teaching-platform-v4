spring:
  application:
    name: teaching-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 8MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teaching_platform}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:12345678}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 双方言占位符由 FlywayPlaceholdersConfig 按 DataSource 产品名注入，profile 不再声明

server:
  port: ${SERVER_PORT:8080}

app:
  # 生产必须通过环境变量 JWT_SECRET 注入（UTF-8 ≥ 32 字节）；仓库内不提供可用默认密钥。
  # local / test 两个 profile 在各自配置文件里提供本地开发用默认值。
  jwt-secret: ${JWT_SECRET:}
  # scripts/path-b/backend.sh 注入仓库根绝对路径；默认 ../data/files 相对 backend/ CWD
  file-storage-root: ${FILE_STORAGE_ROOT:../data/files}
  http-access-log:
    enabled: true
  audit-log:
    retention-days: 180
    retention-enabled: true

# 实验作答行为采集与风险标记（技术方案 §4.4；本地 profile 不覆盖，全走默认值）
lab:
  behavior:
    ingest:
      max-batch-size: 100
      max-payload-bytes: 4096
      clock-skew-tolerance-ms: 600000
    risk:
      per-step-min-ms: 45000
      paste-chars-threshold: 500
      paste-ratio-threshold: 0.3
      hidden-count-threshold: 5
      hidden-ratio-threshold: 0.5
