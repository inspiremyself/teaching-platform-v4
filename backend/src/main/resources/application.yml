spring:
  application:
    name: teaching-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 8MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teaching_platform}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:replace-with-32-char-secret-1234}
  # 路径 B 由 scripts/path-b/backend.sh 注入仓库根绝对路径；默认 ../data/files 相对 backend/ CWD
  file-storage-root: ${FILE_STORAGE_ROOT:../data/files}
