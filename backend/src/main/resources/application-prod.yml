# 生产 profile：只覆盖环境差异，核心约束从 application.yml 继承并在此显式重申。
# 数据源与 JWT_SECRET 必须由环境变量注入，仓库内不提供本地默认值。
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 不声明双方言占位符：由 FlywayPlaceholdersConfig 按 DataSource 产品名注入

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET}
  file-storage-root: ${FILE_STORAGE_ROOT}
