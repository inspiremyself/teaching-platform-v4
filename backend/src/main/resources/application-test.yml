spring:
  datasource:
    # 路径 B：文件模式持久化。默认相对 backend/ 的 ../data/h2（即仓库根 data/h2/）。
    # scripts/path-b/backend.sh 会注入绝对路径 H2_FILE；单元测试仍用 src/test/resources mem。
    url: jdbc:h2:file:${H2_FILE:../data/h2/teaching_platform};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    # 双方言占位符由 FlywayPlaceholdersConfig 按 DataSource 产品名注入，profile 不再声明
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  # 路径 B（H2 文件库）联调用默认密钥，仅 test profile 生效
  jwt-secret: ${JWT_SECRET:test-profile-jwt-secret-32bytes-0002}

logging:
  level:
    org.springframework.security: INFO
    com.opencode.teachingplatform: DEBUG
