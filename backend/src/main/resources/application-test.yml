spring:
  datasource:
    # 路径 B：文件模式持久化。默认相对 backend/ 的 ../data/h2（即仓库根 data/h2/）。
    # scripts/path-b/backend.sh 会注入绝对路径 H2_FILE；单元测试仍用 src/test/resources mem。
    url: jdbc:h2:file:${H2_FILE:../data/h2/teaching_platform};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=FALSE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    # 路径 B（H2 文件库）方言占位符：必须显式覆盖，否则合并到 application.yml 的 MySQL 方言值导致 V15/V16/V18 失败
    placeholders:
      alterModifyColumn: "ALTER COLUMN"
      fkChecksDisable: "SET REFERENTIAL_INTEGRITY FALSE"
      fkChecksEnable: "SET REFERENTIAL_INTEGRITY TRUE"
      mysqlOnly: "--"
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.springframework.security: INFO
    com.opencode.teachingplatform: DEBUG
