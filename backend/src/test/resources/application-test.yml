spring:
  datasource:
    url: jdbc:h2:mem:teaching_platform_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    # V15/V16 双方言占位符：H2 不支持 MODIFY COLUMN / SET FOREIGN_KEY_CHECKS，注入 H2 方言
    placeholders:
      alterModifyColumn: "ALTER COLUMN"
      fkChecksDisable: "SET REFERENTIAL_INTEGRITY FALSE"
      fkChecksEnable: "SET REFERENTIAL_INTEGRITY TRUE"
      # H2 侧把 V16 的 ALTER 行整行注释掉（行首 -- 前缀），避免重置自增计数器与 V13 种子冲突
      mysqlOnly: "--"

app:
  # 单元测试专用默认密钥，仅 test profile 生效
  jwt-secret: ${JWT_SECRET:test-profile-jwt-secret-32bytes-0002}
  # 测试文件目录与仓库 data/ 隔离，落在系统临时目录，测试结束由系统回收
  file-storage-root: ${java.io.tmpdir}/teaching-platform-test-files
  # 单测关闭考试超时自动交卷调度，避免后台任务污染夹具
  exam:
    auto-submit:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
    com.opencode.teachingplatform: DEBUG
